# Turn View's own widget in the instrument cluster's widget menu, "Turn View AR": a cluster-render drop-in
# (robertnisipeanu/idrive-apps PR #170, cluster-render.conf "drop_ins"), read at cluster-render's next start from
# /var/opt/iteriodev-turnview/current/cluster-render.d/ (root-owned, writable by no one else), gone with the tool on
# uninstall. It only adds: the target `turnview` and its scene id, and that target's keys. The tool draws on it when
# cluster-render's hello lists it, else on cluster-render's own widget ("Cluster renderer"); a cluster-render without
# drop-ins never reads this file. Content 43204020 = a dynamic widget (43202001-43205000) no one else offers; scene id
# 0x4d4755000020 ("MGU") no other target's.
id8_targets += turnview
id8_scene_ids_allowed += 0x4d4755000020
id8_turnview_category = 43100301
id8_turnview_content = 43204020
id8_turnview_scene_id = 0x4d4755000020
id8_turnview_size = 2240x896
id8_turnview_linger_ms = 3000
id8_turnview_description = Turn View AR
id8_turnview_order = 52
id8_turnview_focus = 0
# its picture in the widget menu (2026-11-15): 166 x 92 PNG as BMW's own (Hmi8 kombi_preview), read at cluster-render's start
id8_turnview_preview = /var/opt/iteriodev-turnview/current/cluster-render.d/turnview.png
