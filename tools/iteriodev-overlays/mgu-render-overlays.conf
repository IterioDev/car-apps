# iteriodev-overlays: lets the Overlays strip (root client "iteriodev-overlays") be an overlay of mgu-render on
# iDrive 8: always shown, touch first, may claim the climate bar. mgu-render's own ExecStart plus that one setting
# (mgu-render 0.6.10 has overlay_apps empty); removed with the tool. Read at mgu-render's next start.
[Service]
ExecStart=
ExecStart=/var/opt/mgu-render/current/mgu-render -c /var/opt/mgu-render/current/mgu-render.conf -s overlay_apps=iteriodev-overlays
